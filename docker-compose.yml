services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    profiles: ["mailpit"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Loopback : Mailpit (sans authentification) n'est joignable que
      # depuis ce poste, pas depuis le réseau local.
      - "127.0.0.1:8025:8025"

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      # Loopback : le site de développement n'est joignable que depuis ce poste.
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      MAILPIT_ENABLED: "${MAILPIT_ENABLED:-false}"
    volumes:
      - .:/var/www/html/wp-content/plugins/periscolaire-registration
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./theme/Archive:/var/www/html/wp-content/themes/Archive
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
