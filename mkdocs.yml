site_name: Périscolaire — Documentation
site_url: https://eflye.github.io/wp-plugin-extrascolaire/
repo_url: https://github.com/eflye/wp-plugin-extrascolaire
repo_name: eflye/wp-plugin-extrascolaire
docs_dir: documentation
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Basculer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Basculer en mode clair
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Guide des familles:
      - familles/index.md
      - Demander une inscription: familles/inscription.md
      - Se connecter: familles/connexion.md
      - Tableau de bord: familles/tableau-de-bord.md
      - Planning: familles/planning.md
      - Mes enfants et assurance: familles/enfants.md
      - Personnes autorisées: familles/personnes-autorisees.md
      - Factures et documents: familles/factures-documents.md
      - Messages: familles/messages.md
      - Profil et paiement: familles/profil-paiement.md
      - Réinscription: familles/reinscription.md
      - Aide: familles/aide.md
  - Guide de la mairie:
      - mairie.md
      - Démarrage rapide: demarrage-rapide.md
      - Configuration:
          - Année scolaire: configuration/annee-scolaire.md
          - Calendrier et vacances: configuration/calendrier-vacances.md
          - Services et tarifs: configuration/services-tarifs.md
          - Régimes alimentaires: configuration/regimes-alimentaires.md
          - Modèles d'e-mails: configuration/modeles-emails.md
      - Gestion au quotidien:
          - Tableau de bord: gestion-quotidienne/tableau-de-bord.md
          - Modération des inscriptions: gestion-quotidienne/moderation-inscriptions.md
          - Annulations et absences: gestion-quotidienne/annulations-absences.md
          - Menus de cantine: gestion-quotidienne/menus-cantine.md
          - Commande fournisseur: gestion-quotidienne/commande-fournisseur.md
          - Documents (assurance): gestion-quotidienne/documents-assurance.md
          - Personnes autorisées: gestion-quotidienne/personnes-autorisees.md
      - Facturation:
