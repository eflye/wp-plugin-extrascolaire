          - Accès des agents de la mairie: installation/acces-agents.md
          - Envoi des e-mails (SMTP): installation/emails-smtp.md
          - Tâches planifiées: installation/taches-planifiees.md
          - Sauvegarde et mise à jour: installation/sauvegarde-mise-a-jour.md
          - Clé de chiffrement des IBAN: installation/cle-chiffrement.md
          - Fiche de recette de l'hébergement: installation/fiche-recette-p1.md
          - Dépannage et FAQ: installation/depannage-faq.md
      - Glossaire: glossaire.md
      - Contribuer à la documentation: contribuer.md
