site_name: Périscolaire — Documentation administrateur
site_url: https://eflye.github.io/wp-plugin-extrascolaire/
repo_url: https://github.com/eflye/wp-plugin-extrascolaire
repo_name: eflye/wp-plugin-extrascolaire
docs_dir: documentation
site_dir: site

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Basculer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Basculer en mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Glossaire: glossaire.md
  - Contribuer à la documentation: contribuer.md
