name: PHP Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Appelé par release.yml : un tag ne publie qu'après ce contrôle,
  # rejoué sur le commit exact du tag.
  workflow_call:

# Même raison qu'e2e.yml : les poussées successives d'une même branche se
# remplacent, elles ne s'empilent pas.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php-version }} syntax check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . \
            -name "*.php" \
            -not -path "./.github/*" \
            -not -path "./includes/fpdf/*" \
            -print0 \
          | xargs -0 -n1 php -l

      # Tests unitaires des helpers purs, sans bootstrap WordPress
      # (tests/unit/run.php). Sur la matrice plutôt qu'un job unique :
      # les chemins de chiffrement de crypto.php (sodium, openssl, repli)
      # varient selon la build de PHP, et le contrat — aller-retour
      # chiffré, altération détectée, clair hérité préservé — doit tenir
      # sur chacun.
      - name: Tests unitaires des helpers purs
        run: |
          php tests/unit/run.php
          php tests/unit/sepa-export.php
          php tests/unit/menu-labels.php

  # Analyse statique du code de l'extension (includes/), niveau 5 (baseline phpstan-baseline.neon) —
  # cf. phpstan.neon. Le résultat est indépendant de la version de PHP
  # qui exécute l'outil : une seule version suffit, contrairement au
  # simple lint syntaxique ci-dessus. composer.json ne porte que des
  # dépendances de développement (aucune au runtime : l'extension ne
  # requiert rien de composer pour fonctionner sur un site).
  phpstan:
    name: PHPStan (includes/, niveau 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      # Avis de sécurité publiés sur les dépendances (outillage de
      # développement uniquement : rien de composer ne part dans le zip).
      - name: Avis de sécurité (composer)
        run: composer audit --no-interaction

      - name: Analyse statique
        run: composer phpstan

  # Lint JavaScript des écrans (assets/js) — cf. eslint.config.js : un
  # filet minimal (symboles non définis, variables jamais lues) sur un
  # code ES5 assumé, pas une modernisation forcée. Même raison que
  # phpstan ci-dessus : indépendant de la version de PHP, un job suffit.
  eslint:
    name: ESLint (assets/js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Même raison que composer audit : outillage de test, jamais livré.
      - name: Avis de sécurité (npm)
        run: npm audit --audit-level=high

      - name: Lint JavaScript
        run: npx eslint assets/js

      # Le navigateur vient du CDN de Playwright : le 27/10/2026, quatre
      # exécutions ont été annulées au délai du job parce que ce
      # téléchargement a pris 600 à 700 s au lieu de 25 s, scénarios verts.
      # Il est donc mis en cache par version de @playwright/test, et
      # sauvegardé dès l'installation (restore + save explicites) pour
      # qu'un échec ultérieur du job ne fasse pas perdre le cache. Seules
      # les dépendances système (apt, miroirs Ubuntu) restent à installer.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restaure le navigateur Playwright
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Installe Chromium pour les validateurs bancaires
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Sauvegarde le navigateur Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Dépendances système du navigateur
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Teste les champs IBAN des trois formulaires
        run: npm run test:banking
